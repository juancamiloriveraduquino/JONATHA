<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodTracker - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="modelo.css">
</head>
<body>
<div class="container-fluid vh-100">
<div class="row h-100">
<div class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-white">
<div class="text-center mb-4">
 <img src="Food.png" alt="FoodTracker" class="logo-img mb-3">
 <hr class="custom-line">
</div>

<form class="w-50 mx-auto" onsubmit="return loginUser(event)">
  <div class="mb-3">
    <input type="text" class="form-control rounded-pill" placeholder="USUARIO" id="usuario" required>
  </div>
  <div class="mb-3">
    <input type="password" class="form-control rounded-pill" placeholder="PASSWORD" id="password" required>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="mantenerSesion">
    <label class="form-check-label" for="mantenerSesion"> Mantener la sesión abierta</label>
  </div>
  <button type="submit" class="btn btn-success w-100">INGRESAR</button>
</form>

</div>
<div class="col-md-6 p-0">
<img src="Señores.png" alt="Restaurante" class="img-fluid h-70 w-100 object-fit-cover">
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="modelo.js"></script>
</body>
</html>
