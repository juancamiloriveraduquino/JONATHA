<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="modelo.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
<div class="container-fluid">
   
<div class="collapse navbar-collapse" id="mainNav">
<ul class="navbar-nav me-auto"> 

 <li class="nav-item"><a class="nav-link fs-5" href="#">Inicio</a></li>
 <li class="nav-item"><a class="nav-link fs-5" href="#">Servicios</a></li>
 <li class="nav-item"><a class="nav-link fs-5" href="#">Pedidos</a></li>
 <li class="nav-item"><a class="nav-link fs-5" href="#">Facturar</a></li>
 </ul>
 </div>

<a class="navbar-brand ms-auto" href="#">
<img src="Food.png" alt="Logo" width="180" height="70">
</a>
 <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
 <span class="navbar-toggler-icon"></span>
</button>
</div>
</nav>

<div class="container-fluid mt-4">
<div class="row">

 <aside class="col-md-3 col-lg-2 p-3 sidebar">
<h5 class="text-center text-white fw-bold mb-3">SERVICIOS</h5>
<div class="d-grid gap-3">
 <a href="#" class="btn btn-light fw-semibold">RESTAURANTE</a>
 <a href="#" class="btn btn-light fw-semibold">BAR</a>
 <a href="#" class="btn btn-light fw-semibold">EVENTOS</a>
 <a href="#" class="btn btn-light fw-semibold">CONTACTENOS</a>
</div>
</aside>

 <main class="col-md-9 col-lg-10 p-4">
<div class="card shadow-sm p-4">
 <h2 class="fw-bold fst-italic">Food Tracker</h2>
<p class="text-muted fst-italic">La mejor experiencia</p>

       
 <form id="foodForm" class="row g-2 align-items-center">
 <div class="col-md-4">
 <input type="text" class="form-control" id="nombreComida" placeholder="Nombre de la comida" required>
</div>
<div class="col-md-2">
 <input type="time" class="form-control" id="horaComida" required>
</div>
 <div class="col-md-3">
<input type="number" class="form-control" id="calorias" placeholder="Calorías" required>
</div>
<div class="col-md-2">
 <button type="submit" class="btn btn-success w-100">Agregar</button>
</div>
</form>

<div class="mt-4">
 <h5>Comidas registradas</h5>
 <ul class="list-group" id="listaComidas"></ul>
</div>
</div>
</main>
</div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="modelo.js"></script>
</body>
</html>
